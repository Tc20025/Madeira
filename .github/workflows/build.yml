name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Automatically Find and Build Project
        run: |
          # Dynamically look for an xcodeproj or xcworkspace
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          PROJECT_PATH=$(find . -name "*.xcodeproj" -print -quit)
          
          if [ -n "$WORKSPACE_PATH" ]; then
            echo "Found workspace at $WORKSPACE_PATH"
            # Get the first available build scheme
            SCHEME=$(xcodebuild -workspace "$WORKSPACE_PATH" -list | sed -n '/Schemes:/,$p' | tail -n +2 | tr -d ' ' | head -n 1)
            echo "Selected scheme: $SCHEME"
            
            xcodebuild clean build \
              -workspace "$WORKSPACE_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE=""
              
          elif [ -n "$PROJECT_PATH" ]; then
            echo "Found project at $PROJECT_PATH"
            SCHEME=$(xcodebuild -project "$PROJECT_PATH" -list | sed -n '/Schemes:/,$p' | tail -n +2 | tr -d ' ' | head -n 1)
            echo "Selected scheme: $SCHEME"
            
            xcodebuild clean build \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE=""
          else
            echo "Error: No Xcode project or workspace found in the repository."
            exit 1
          fi

      - name: Package Into IPA File
        run: |
          mkdir -p Payload
          # Automatically finds the compiled .app folder wherever Xcode saved it
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData/ -name "*.app" -path "*/Release-iphoneos/*" -print -quit 2>/dev/null || find . -name "*.app" -path "*/Release-iphoneos/*" -print -quit)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find compiled .app file."
            exit 1
          fi
          
          echo "Found compiled app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa
          retention-days: 5
