name: Build Madeira IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive # Automatically pulls FEX, Wine, or DXMT dependencies if included

      - name: Set up Xcode Version
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      - name: Build Xcode Project
        run: |
          # Cleans and builds the scheme. 
          # Replace 'Madeira' with the exact scheme name if it differs in the project.
          xcodebuild clean build \
            -project Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Package Into IPA File
        run: |
          mkdir -p Payload
          # Locates the compiled .app file and moves it into the Payload folder
          cp -r build/Release-iphoneos/Madeira.app Payload/ 2>/dev/null || cp -r ~/Library/Developer/Xcode/DerivedData/*/Build/Products/Release-iphoneos/Madeira.app Payload/
          zip -r Madeira.ipa Payload

      - name: Upload IPA Package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-Unsigned-IPA
          path: Madeira.ipa
          retention-days: 5
