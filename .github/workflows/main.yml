name: Build Madeira IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      LLVM_VERSION: "15.0.7"
      LLVM_MINGW_VERSION: "20260421-ucrt-macos-universal"
      IOS_DEPLOYMENT_TARGET: "17.0"

      LLVM_SRC: "${{ github.workspace }}/toolchains/llvm-project"
      LLVM_HOST_BUILD: "${{ github.workspace }}/toolchains/llvm-host-build"
      LLVM_IOS_BUILD: "${{ github.workspace }}/toolchains/llvm-ios-build"

      LLVM_MINGW_BIN: "${{ github.workspace }}/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin"

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ================================================================
      # 2. SHOW XCODE / SDK
      # ================================================================
      - name: Show Xcode
        shell: bash
        run: |
          set -euxo pipefail

          xcodebuild -version
          xcode-select -p

          echo "macOS:"
          sw_vers

          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo "iPhoneOS SDK version:"
          xcrun --sdk iphoneos --show-sdk-version

          echo "Architecture:"
          uname -m

      # ================================================================
      # 3. INSTALL BUILD TOOLS
      # ================================================================
      - name: Install Homebrew dependencies
        shell: bash
        run: |
          set -euxo pipefail

          brew update

          brew install \
            cmake \
            ninja \
            meson \
            bison \
            flex \
            pkg-config \
            sevenzip

          echo "Homebrew prefix:"
          brew --prefix

          echo "Installed versions:"
          cmake --version
          ninja --version
          meson --version
          7zz --help | head -n 5

      # ================================================================
      # 4. PATH
      # ================================================================
      - name: Configure build PATH
        shell: bash
        run: |
          set -euxo pipefail

          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix sevenzip)/bin" >> "$GITHUB_PATH"

      # ================================================================
      # 5. DOWNLOAD APPLE METAL TOOLCHAIN
      # ================================================================
      - name: Install Metal Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "Selected Xcode:"
          xcodebuild -version

          echo
          echo "Developer directory:"
          xcode-select -p

          echo
          echo "Checking Metal compiler..."

          if xcrun --find metal >/dev/null 2>&1; then
            echo "Metal Toolchain is already installed."
          else
            echo "Metal Toolchain is missing."
            echo "Downloading Metal Toolchain..."

            xcodebuild -downloadComponent metalToolchain
          fi

          echo
          echo "Verifying Metal compiler..."

          METAL="$(xcrun --find metal)"

          test -x "$METAL"

          echo "Metal compiler:"
          echo "$METAL"

          echo
          echo "Metal version:"
          xcrun metal -version

      # ================================================================
      # 6. LLVM-MINGW
      # ================================================================
      - name: Download LLVM-MinGW
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p toolchains

          cd toolchains

          curl -L --fail --retry 5 \
            -o llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}.tar.xz"

          tar -xf llvm-mingw.tar.xz

          rm -f llvm-mingw.tar.xz

          test -x \
            "llvm-mingw-${LLVM_MINGW_VERSION}/bin/aarch64-w64-mingw32-clang"

          test -x \
            "llvm-mingw-${LLVM_MINGW_VERSION}/bin/x86_64-w64-mingw32-clang"

          echo "LLVM-MinGW installed:"
          ls -la "llvm-mingw-${LLVM_MINGW_VERSION}/bin" | head -n 30

      # ================================================================
      # 7. VERIFY LLVM-MINGW
      # ================================================================
      - name: Verify LLVM-MinGW
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$LLVM_MINGW_BIN:$PATH"

          which aarch64-w64-mingw32-clang
          which x86_64-w64-mingw32-clang

          aarch64-w64-mingw32-clang --version
          x86_64-w64-mingw32-clang --version

      # ================================================================
      # 8. DOWNLOAD LLVM 15.0.7
      # ================================================================
      - name: Download LLVM 15.0.7 source
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p toolchains

          cd toolchains

          curl -L --fail --retry 5 \
            -o llvm-project.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/llvm-project-${LLVM_VERSION}.src.tar.xz"

          rm -rf llvm-project

          mkdir llvm-project

          tar -xf llvm-project.tar.xz \
            --strip-components=1 \
            -C llvm-project

          rm -f llvm-project.tar.xz

          test -f llvm-project/llvm/CMakeLists.txt
          test -f llvm-project/llvm/cmake/modules/AddLLVM.cmake

          echo "LLVM source:"
          ls -la llvm-project/llvm | head

      # ================================================================
      # 9. BUILD HOST LLVM-TBLGEN
      # ================================================================
      - name: Build host llvm-tblgen
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_HOST_BUILD"

          cmake \
            -S "$LLVM_SRC/llvm" \
            -B "$LLVM_HOST_BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_TOOLS=ON

          cmake \
            --build "$LLVM_HOST_BUILD" \
            --target llvm-tblgen \
            -j"$(sysctl -n hw.ncpu)"

          test -x "$LLVM_HOST_BUILD/bin/llvm-tblgen"

          echo "Host llvm-tblgen:"
          "$LLVM_HOST_BUILD/bin/llvm-tblgen" --version

      # ================================================================
      # 10. PATCH LLVM FOR IOS
      #
      # IMPORTANT:
      #
      # The previous build failed with:
      #
      #   ld: unknown options: --gc-sections
      #
      # Apple ld64 uses:
      #
      #   -dead_strip
      #
      # instead.
      #
      # We patch AddLLVM.cmake AND explicitly disable LLVM's dead-strip
      # helper. The generated Ninja files are checked before compilation.
      # ================================================================
      - name: Patch LLVM 15.0.7 for iOS linker
        shell: bash
        run: |
          set -euxo pipefail

          FILE="$LLVM_SRC/llvm/cmake/modules/AddLLVM.cmake"

          echo "Checking LLVM linker logic..."

          grep -nE 'Darwin|gc-sections|dead_strip|LLVM_NO_DEAD_STRIP' "$FILE" || true

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          original = text

          replacements = [
              ('MATCHES "Darwin"', 'MATCHES "Darwin|iOS"'),
              ("MATCHES \"Darwin\"", "MATCHES \"Darwin|iOS\""),
          ]

          for old, new in replacements:
              text = text.replace(old, new)

          if text == original:
              print("WARNING: No Darwin condition was changed.")
              print("This is not fatal because LLVM_NO_DEAD_STRIP=ON is also used.")
          else:
              path.write_text(text)
              print("LLVM AddLLVM.cmake patched successfully.")
          PY

          echo
          echo "Relevant linker logic after patch:"
          grep -nE 'Darwin|gc-sections|dead_strip|LLVM_NO_DEAD_STRIP' "$FILE" || true

      # ================================================================
      # 11. CONFIGURE LLVM FOR IOS
      # ================================================================
      - name: Configure LLVM 15.0.7 for iOS
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_IOS_BUILD"

          cmake \
            -S "$LLVM_SRC/llvm" \
            -B "$LLVM_IOS_BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_AR="$(xcrun --sdk iphoneos --find ar)" \
            -DCMAKE_RANLIB="$(xcrun --sdk iphoneos --find ranlib)" \
            -DLLVM_TABLEGEN="$LLVM_HOST_BUILD/bin/llvm-tblgen" \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_ENABLE_RUNTIMES="" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_NO_DEAD_STRIP=ON

          echo
          echo "Checking generated Ninja files for GNU linker flags..."

          if grep -R \
            -- '--gc-sections' \
            "$LLVM_IOS_BUILD" \
            --include='build.ninja' \
            --include='*.ninja'
          then
            echo
            echo "ERROR: --gc-sections is still present in the iOS LLVM build."
            echo "The build is intentionally stopped before compiling."
            exit 1
          fi

          echo
          echo "No --gc-sections found."

          echo
          echo "Checking for Apple dead-strip flag..."

          grep -R \
            -- '-dead_strip' \
            "$LLVM_IOS_BUILD" \
            --include='build.ninja' \
            --include='*.ninja' \
            | head -n 20 || true

      # ================================================================
      # 12. BUILD LLVM FOR IOS
      # ================================================================
      - name: Build LLVM 15.0.7 for iOS
        shell: bash
        run: |
          set -euxo pipefail

          cmake \
            --build "$LLVM_IOS_BUILD" \
            -j"$(sysctl -n hw.ncpu)"

          echo
          echo "LLVM iOS build complete."

          echo
          echo "Libraries:"
          find "$LLVM_IOS_BUILD/lib" \
            -maxdepth 1 \
            -type f \
            -name '*.a' \
            -print \
            | sort

      # ================================================================
      # 13. VERIFY LLVM IOS TOOLCHAIN
      # ================================================================
      - name: Verify LLVM iOS libraries
        shell: bash
        run: |
          set -euxo pipefail

          test -d "$LLVM_IOS_BUILD/lib"

          test -f "$LLVM_IOS_BUILD/lib/libLLVMCore.a" || true

          echo "LLVM iOS libraries:"
          find "$LLVM_IOS_BUILD/lib" \
            -maxdepth 1 \
            -name '*.a' \
            -print \
            | sort

      # ================================================================
      # 14. ROSETTA
      # ================================================================
      - name: Install Rosetta 2
        shell: bash
        run: |
          set -euxo pipefail

          softwareupdate --install-rosetta --agree-to-license || true

          arch -x86_64 /usr/bin/true

      # ================================================================
      # 15. DOWNLOAD GCENX WINE RUNTIME
      #
      # This is only used to execute the x86_64 HLSL compiler.
      # Madeira's own Wine source tree is built separately below.
      # ================================================================
      - name: Install Gcenx Wine runtime
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$RUNNER_TEMP/gcenx-wine"

          cd "$RUNNER_TEMP/gcenx-wine"

          curl -L --fail --retry 5 \
            -o wine.tar.xz \
            "https://github.com/Gcenx/Wine-on-macOS/releases/download/11.16/wine-devel-11.16-osx64.tar.xz"

          tar -xf wine.tar.xz

          echo "Extracted Wine:"
          find . -maxdepth 4 -type f -name wine -print

          WINE_BIN="$(find "$RUNNER_TEMP/gcenx-wine" -type f -path '*/bin/wine' | head -n 1)"

          if [ -z "$WINE_BIN" ]; then
            echo "ERROR: Could not find Gcenx Wine executable."
            exit 1
          fi

          chmod +x "$WINE_BIN"

          echo "GCENX_WINE_BIN=$WINE_BIN" >> "$GITHUB_ENV"

          echo "Wine runtime:"
          "$WINE_BIN" --version || true

      # ================================================================
      # 16. CONFIGURE MADEIRA WINE
      # ================================================================
      - name: Configure Madeira Wine
        shell: bash
        working-directory: wine
        run: |
          set -euxo pipefail

          rm -rf build-macos

          mkdir -p build-macos

          cd build-macos

          ../configure \
            --with-mingw="${LLVM_MINGW_BIN}/clang" \
            --enable-archs=arm64ec,aarch64,x86_64 \
            --enable-win64 \
            --enable-tools \
            --disable-tests \
            --disable-win16 \
            --without-x \
            --without-wayland \
            --without-xinerama \
            --without-xcursor \
            --without-xinput \
            --without-oss \
            --without-pulse \
            --without-gstreamer \
            --without-v4l2 \
            --without-sane \
            --without-udev \
            --without-usb \
            --without-pcap \
            --without-pcsclite \
            --without-cups \
            --without-dbus \
            --without-gphoto \
            --without-krb5 \
            --without-capi \
            --without-opengl

      # ================================================================
      # 17. BUILD WINEBUILD
      # ================================================================
      - name: Build Wine tools
        shell: bash
        working-directory: wine
        run: |
          set -euxo pipefail

          make \
            -C tools/winebuild \
            -j"$(sysctl -n hw.ncpu)"

          test -x build-macos/tools/winebuild/winebuild

          echo "winebuild:"
          build-macos/tools/winebuild/winebuild --version || true

      # ================================================================
      # 18. BUILD FEX
      # ================================================================
      - name: Build FEX for iOS
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEXCORE_PROFILER=OFF \
            -DENABLE_ASSERTIONS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF

          cmake \
            --build FEX/build-ios \
            --target \
              FEXCore \
              FEXCore_Base \
              JemallocLibs \
            -j"$(sysctl -n hw.ncpu)"

          echo
          echo "FEX libraries:"
          find FEX/build-ios \
            -type f \
            \( \
              -name 'libFEXCore.a' \
              -o -name 'libFEXCore_Base.a' \
              -o -name 'libJemallocLibs.a' \
            \) \
            -print

      # ================================================================
      # 19. VERIFY FEX
      # ================================================================
      - name: Verify FEX libraries
        shell: bash
        run: |
          set -euxo pipefail

          test -f FEX/build-ios/FEXCore/Source/libFEXCore.a
          test -f FEX/build-ios/FEXCore/Source/libFEXCore_Base.a
          test -f FEX/build-ios/FEXCore/Source/libJemallocLibs.a

      # ================================================================
      # 20. BUILD NATIVE MADEIRA COMPONENTS
      # ================================================================
      - name: Build crypto-unix
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/crypto-unix/build.sh
          ./build/crypto-unix/build.sh

      - name: Build freetype-ios
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/freetype-ios/build.sh
          ./build/freetype-ios/build.sh

      - name: Build gnutls-ios
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/gnutls-ios/build.sh
          ./build/gnutls-ios/build.sh

      - name: Build ntdll-unix
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/ntdll-unix/build.sh
          ./build/ntdll-unix/build.sh

      - name: Build win32u-unix
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/win32u-unix/build.sh
          ./build/win32u-unix/build.sh

      - name: Build wineserver
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/wineserver/build.sh
          ./build/wineserver/build.sh

      - name: Build wineios-drv
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build/wineios-drv/build.sh
          ./build/wineios-drv/build.sh

      # ================================================================
      # 21. PREPARE DXMT TOOLCHAINS LINK
      # ================================================================
      - name: Prepare DXMT toolchains
        shell: bash
        run: |
          set -euxo pipefail

          rm -f research/dxmt/toolchains

          ln -s \
            ../../toolchains \
            research/dxmt/toolchains

          test -e research/dxmt/toolchains

          echo "DXMT toolchains:"
          ls -la research/dxmt/toolchains

      # ================================================================
      # 22. BUILD DXMT WINDOWS PE COMPONENTS
      # ================================================================
      - name: Configure DXMT PE build
        shell: bash
        working-directory: research/dxmt
        run: |
          set -euxo pipefail

          rm -rf build-pe

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"

          export PATH="$PWD/toolchains/llvm-mingw-${LLVM_MINGW_VERSION}/bin:/usr/bin:$(brew --prefix)/bin:$PATH"

          meson setup \
            --cross-file build-aarch64-win.txt \
            --native-file build-osx.txt \
            -Dwine_build_path=../../wine/build-macos \
            build-pe

      - name: Build DXMT PE
        shell: bash
        working-directory: research/dxmt
        run: |
          set -euxo pipefail

          meson compile \
            -C build-pe \
            -j"$(sysctl -n hw.ncpu)"

          echo
          echo "DXMT PE output:"
          find build-pe \
            -type f \
            \( \
              -name 'd3d11.dll' \
              -o -name 'dxgi.dll' \
              -o -name 'winemetal.dll' \
              -o -name 'd3d10core.dll' \
            \) \
            -print

      # ================================================================
      # 23. COPY DXMT WINDOWS DLLS
      # ================================================================
      - name: Install DXMT Windows DLLs
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p app/Madeira/aarch64-windows

          for dll in \
            d3d11.dll \
            dxgi.dll \
            winemetal.dll \
            d3d10core.dll
          do
            SOURCE="$(find research/dxmt/build-pe \
              -type f \
              -name "$dll" \
              | head -n 1)"

            if [ -z "$SOURCE" ]; then
              echo "ERROR: $dll was not produced."
              exit 1
            fi

            cp "$SOURCE" \
              "app/Madeira/aarch64-windows/$dll"
          done

          ls -lh app/Madeira/aarch64-windows

      # ================================================================
      # 24. BUILD DXMT UNIX SIDE
      # ================================================================
      - name: Build DXMT Unix
        shell: bash
        working-directory: research/dxmt
        run: |
          set -euxo pipefail

          chmod +x build.sh

          ./build.sh

          echo
          echo "DXMT Unix objects:"
          find obj \
            -type f \
            -name '*.o' \
            -print \
            | head -n 30

      # ================================================================
      # 25. COMBINE DXMT IOS STATIC LIBRARIES
      # ================================================================
      - name: Combine DXMT iOS libraries
        shell: bash
        working-directory: research/dxmt
        run: |
          set -euxo pipefail

          xcrun -sdk iphoneos libtool \
            -static \
            -o libdxmt_combined.a \
            obj/*.o \
            ../../toolchains/llvm-ios-build/lib/*.a

          test -f libdxmt_combined.a

          cp \
            libdxmt_combined.a \
            ../../app/Madeira/libdxmt_combined.a

          ls -lh \
            ../../app/Madeira/libdxmt_combined.a

      # ================================================================
      # 26. BUILD D3D11 TRIANGLE / WINEBUILD GENERATED MODULE
      # ================================================================
      - name: Build d3d11 triangle
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x build/d3d11-triangle/build.sh

          ./build/d3d11-triangle/build.sh

      # ================================================================
      # 27. FETCH MICROSOFT VC++ RUNTIME
      #
      # Madeira expects the twelve Microsoft DLLs listed in
      # tools/fetch-vcruntime.md.
      # ================================================================
      - name: Fetch Microsoft Visual C++ runtime
        shell: bash
        run: |
          set -euxo pipefail

          VC_DIR="$GITHUB_WORKSPACE/app/Madeira/x86_64-vcruntime"

          rm -rf "$VC_DIR"
          mkdir -p "$VC_DIR"

          cd "$RUNNER_TEMP"

          rm -rf vcredist
          mkdir -p vcredist

          curl -L --fail --retry 5 \
            -o VC_redist.x64.exe \
            "https://aka.ms/vs/17/release/vc_redist.x64.exe"

          7zz x \
            VC_redist.x64.exe \
            -ovcredist

          CAB="$(find vcredist \
            -type f \
            -name '*.cab' \
            | head -n 1)"

          if [ -z "$CAB" ]; then
            echo "ERROR: Could not find VC runtime CAB."
            find vcredist -maxdepth 5 -type f -print
            exit 1
          fi

          7zz x \
            "$CAB" \
            -o"$VC_DIR"

          echo
          echo "VC runtime files:"
          find "$VC_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.dll' \
            -print \
            | sort

          REQUIRED_DLLS=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            vcamp140.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          for dll in "${REQUIRED_DLLS[@]}"; do
            if [ ! -f "$VC_DIR/$dll" ]; then
              echo "ERROR: Missing Microsoft DLL: $dll"
              exit 1
            fi
          done

          echo
          echo "All required Microsoft VC++ runtime DLLs are present."

      # ================================================================
      # 28. VERIFY ALL REQUIRED MADEIRA LIBRARIES
      # ================================================================
      - name: Verify build outputs
        shell: bash
        run: |
          set -euxo pipefail

          echo "================================================"
          echo "Verifying Madeira build outputs"
          echo "================================================"

          REQUIRED=(
            "app/Madeira/libdxmt_combined.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
            "wine/build-macos/tools/winebuild/winebuild"
          )

          for file in "${REQUIRED[@]}"; do
            if [ ! -e "$file" ]; then
              echo "ERROR: Missing required output:"
              echo "  $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo
          echo "DXMT Windows DLLs:"
          ls -lh app/Madeira/aarch64-windows/*.dll

          echo
          echo "VC runtime:"
          ls -lh app/Madeira/x86_64-vcruntime/*.dll

      # ================================================================
      # 29. SHOW XCODE PROJECTS / SCHEMES
      # ================================================================
      - name: Inspect Xcode project
        shell: bash
        working-directory: app
        run: |
          set -euxo pipefail

          echo "Xcode files:"
          find . \
            -maxdepth 2 \
            \( \
              -name '*.xcodeproj' \
              -o -name '*.xcworkspace' \
            \) \
            -print

          echo
          echo "Project contents:"
          ls -la

          PROJECT="$(find . -maxdepth 2 -name '*.xcodeproj' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found."
            exit 1
          fi

          echo "Using project:"
          echo "$PROJECT"

          xcodebuild \
            -project "$PROJECT" \
            -list

      # ================================================================
      # 30. BUILD IOS APP
      # ================================================================
      - name: Build Madeira iOS app
        shell: bash
        working-directory: app
        run: |
          set -euxo pipefail

          PROJECT="$(find . -maxdepth 2 -name '*.xcodeproj' | head -n 1)"

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No .xcodeproj found."
            exit 1
          fi

          echo "Building:"
          echo "$PROJECT"

          rm -rf build

          xcodebuild \
            -project "$PROJECT" \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            IPHONEOS_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            build

      # ================================================================
      # 31. FIND APP
      # ================================================================
      - name: Locate built app
        shell: bash
        working-directory: app
        run: |
          set -euxo pipefail

          APP_PATH="$(find build \
            -type d \
            -name '*.app' \
            | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find built .app"
            find build -maxdepth 6 -type d -print
            exit 1
          fi

          echo "APP_PATH=$PWD/$APP_PATH" >> "$GITHUB_ENV"

          echo "Built application:"
          echo "$PWD/$APP_PATH"

          du -sh "$APP_PATH"

      # ================================================================
      # 32. PACKAGE IPA
      # ================================================================
      - name: Package IPA
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$GITHUB_WORKSPACE/Payload"
          rm -f "$GITHUB_WORKSPACE/Madeira.ipa"

          mkdir -p "$GITHUB_WORKSPACE/Payload"

          cp -R \
            "$APP_PATH" \
            "$GITHUB_WORKSPACE/Payload/"

          cd "$GITHUB_WORKSPACE"

          zip -r \
            Madeira.ipa \
            Payload \
            >/dev/null

          test -f Madeira.ipa

          echo
          echo "IPA created:"
          ls -lh Madeira.ipa

          echo
          echo "SHA256:"
          shasum -a 256 Madeira.ipa

      # ================================================================
      # 33. UPLOAD IPA
      # ================================================================
      - name: Upload Madeira IPA
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: Madeira.ipa
          if-no-files-found: error
          retention-days: 7

      # ================================================================
      # 34. UPLOAD BUILD LOGS IF SOMETHING FAILS
      # ================================================================
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-build-diagnostics
          path: |
            app/build
            FEX/build-ios
            toolchains/llvm-ios-build
            toolchains/llvm-host-build
          if-no-files-found: ignore
          retention-days: 3
