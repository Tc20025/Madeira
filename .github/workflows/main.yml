name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # BASIC SYSTEM INFORMATION
      # ============================================================

      - name: Show build environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Machine"
          echo "========================================"

          uname -a
          uname -m
          sysctl -n hw.ncpu

          echo
          echo "========================================"
          echo "Xcode"
          echo "========================================"

          xcodebuild -version

          echo
          echo "========================================"
          echo "iPhoneOS SDK"
          echo "========================================"

          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "========================================"
          echo "Submodules"
          echo "========================================"

          git submodule status --recursive

      # ============================================================
      # HOMEBREW DEPENDENCIES
      # ============================================================

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail

          brew update

          brew install \
            cmake \
            ninja \
            meson \
            bison \
            flex \
            pkg-config \
            sevenzip \
            autoconf \
            automake \
            libtool \
            gettext \
            gnutls \
            nettle \
            gmp \
            python

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"

      # ============================================================
      # METAL TOOLCHAIN
      #
      # Required by current Madeira DXMT iOS build.
      # ============================================================

      - name: Install Metal Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "Installing Apple Metal Toolchain"
          echo "========================================"

          xcodebuild -downloadComponent MetalToolchain || true

      # ============================================================
      # LLVM-MINGW
      # ============================================================

      - name: Install LLVM MinGW
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          TOOLCHAIN="$ROOT/toolchains"

          mkdir -p "$TOOLCHAIN"

          cd "$TOOLCHAIN"

          echo "========================================"
          echo "Downloading LLVM MinGW"
          echo "========================================"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -O \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz

          echo
          echo "========================================"
          echo "Extracting LLVM MinGW"
          echo "========================================"

          tar -xf llvm-mingw-20260421-ucrt-macos-universal.tar.xz

          rm -f llvm-mingw-20260421-ucrt-macos-universal.tar.xz

          LLVM_MINGW="$TOOLCHAIN/llvm-mingw-20260421-ucrt-macos-universal"

          test -x "$LLVM_MINGW/bin/aarch64-w64-mingw32-clang"
          test -x "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang"

          echo "LLVM_MINGW_ROOT=$LLVM_MINGW" >> "$GITHUB_ENV"
          echo "LLVM_MINGW_BIN=$LLVM_MINGW/bin" >> "$GITHUB_ENV"

          echo "$LLVM_MINGW/bin" >> "$GITHUB_PATH"

          echo
          echo "========================================"
          echo "LLVM MinGW version"
          echo "========================================"

          "$LLVM_MINGW/bin/aarch64-w64-mingw32-clang" --version
          "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" --version

      # ============================================================
      # VERIFY LLVM-MINGW
      # ============================================================

      - name: Verify LLVM MinGW
        shell: bash
        run: |
          set -euxo pipefail

          command -v aarch64-w64-mingw32-clang
          command -v x86_64-w64-mingw32-clang

          echo
          echo "Testing ARM64 Windows compilation"

          cat > /tmp/test.c <<'EOF'
          int main(void) {
              return 0;
          }
          EOF

          aarch64-w64-mingw32-clang \
            /tmp/test.c \
            -o /tmp/test-arm64.exe

          file /tmp/test-arm64.exe

      # ============================================================
      # LLVM 15.0.7 FOR iOS
      #
      # Madeira DXMT requires:
      #
      # toolchains/llvm-ios-build/
      #
      # It is a two-stage LLVM build:
      #
      # 1. Native macOS llvm-tblgen
      # 2. iOS LLVM libraries
      # ============================================================

      - name: Build LLVM 15.0.7 for iOS
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$GITHUB_WORKSPACE"
          TOOLCHAIN="$ROOT/toolchains"

          LLVM_PROJECT="$TOOLCHAIN/llvm-project"
          LLVM_SRC="$LLVM_PROJECT/llvm"

          HOST_BUILD="$TOOLCHAIN/llvm-host-build"
          IOS_BUILD="$TOOLCHAIN/llvm-ios-build"

          echo "========================================"
          echo "Downloading LLVM 15.0.7"
          echo "========================================"

          if [ ! -d "$LLVM_PROJECT/.git" ]; then
            git clone \
              --depth 1 \
              --branch llvmorg-15.0.7 \
              https://github.com/llvm/llvm-project.git \
              "$LLVM_PROJECT"
          fi

          echo
          echo "LLVM commit:"
          git -C "$LLVM_PROJECT" rev-parse HEAD

          # --------------------------------------------------------
          # Apple linker fix required by Madeira's DXMT instructions.
          #
          # Add iOS to the Darwin test so LLVM uses -dead_strip
          # rather than --gc-sections.
          # --------------------------------------------------------

          ADDLLVM="$LLVM_SRC/cmake/modules/AddLLVM.cmake"

          if grep -q 'MATCHES "Darwin"' "$ADDLLVM"; then
            python3 - <<'PY'
          from pathlib import Path

          p = Path("toolchains/llvm-project/llvm/cmake/modules/AddLLVM.cmake")
          s = p.read_text()

          old = 'MATCHES "Darwin"'
          new = 'MATCHES "Darwin|iOS"'

          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          fi

          echo
          echo "========================================"
          echo "Building host llvm-tblgen"
          echo "========================================"

          rm -rf "$HOST_BUILD"

          cmake \
            -S "$LLVM_SRC" \
            -B "$HOST_BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_BUILD_UTILS=ON \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF

          cmake \
            --build "$HOST_BUILD" \
            --target llvm-tblgen \
            -j"$(sysctl -n hw.ncpu)"

          LLVM_TBLGEN="$HOST_BUILD/bin/llvm-tblgen"

          test -x "$LLVM_TBLGEN"

          echo
          echo "llvm-tblgen:"
          "$LLVM_TBLGEN" --version

          echo
          echo "========================================"
          echo "Building LLVM for iOS"
          echo "========================================"

          rm -rf "$IOS_BUILD"

          cmake \
            -S "$LLVM_SRC" \
            -B "$IOS_BUILD" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DLLVM_TABLEGEN="$LLVM_TBLGEN" \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_ENABLE_RUNTIMES="" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_INCLUDE_GO_TESTS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_ENABLE_CURL=OFF \
            -DLLVM_ENABLE_ZSTD=OFF

          cmake \
            --build "$IOS_BUILD" \
            -j"$(sysctl -n hw.ncpu)"

          echo
          echo "========================================"
          echo "Checking LLVM iOS output"
          echo "========================================"

          find "$IOS_BUILD/lib" \
            -maxdepth 1 \
            -type f \
            -name "*.a" \
            -print | sort

          if ! find "$IOS_BUILD/lib" \
            -maxdepth 1 \
            -type f \
            -name "*.a" \
            | grep -q .; then

            echo "ERROR: LLVM iOS static libraries were not produced."
            exit 1
          fi

      # ============================================================
      # ROSETTA 2
      # ============================================================

      - name: Install Rosetta 2
        shell: bash
        run: |
          set -euxo pipefail

          sudo /usr/sbin/softwareupdate \
            --install-rosetta \
            --agree-to-license || true

      # ============================================================
      # WINE RUNTIME
      #
      # Used to execute hlsl_compile.exe.
      # ============================================================

      - name: Install Wine runtime
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Downloading Gcenx Wine"
          echo "========================================"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o wine-devel.tar.xz \
            https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.16/wine-devel-11.16-osx64.tar.xz

          tar -xf wine-devel.tar.xz

          rm -f wine-devel.tar.xz

          xattr -rc "Wine Devel.app" || true

          WINE_BIN="$GITHUB_WORKSPACE/Wine Devel.app/Contents/Resources/wine/bin"

          test -x "$WINE_BIN/wine"

          sudo mkdir -p /opt/homebrew/bin

          sudo ln -sf \
            "$WINE_BIN/wine" \
            /opt/homebrew/bin/wine

          if [ -f "$WINE_BIN/wine64" ]; then
            sudo ln -sf \
              "$WINE_BIN/wine64" \
              /opt/homebrew/bin/wine64
          fi

          if [ -f "$WINE_BIN/wineboot" ]; then
            sudo ln -sf \
              "$WINE_BIN/wineboot" \
              /opt/homebrew/bin/wineboot
          fi

          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

          echo "WINE=/opt/homebrew/bin/wine" >> "$GITHUB_ENV"

          /opt/homebrew/bin/wine --version || true

      # ============================================================
      # INITIALIZE WINE
      # ============================================================

      - name: Initialize Wine
        shell: bash
        env:
          WINEDEBUG: "-all"
          WINEDLLOVERRIDES: "mscoree,mshtml="
        run: |
          set -euxo pipefail

          /opt/homebrew/bin/wineboot --init || true

      # ============================================================
      # BUILD MADEIRA WINE
      #
      # Produces:
      #
      # wine/build-macos/tools/winebuild/winebuild
      #
      # This is required by d3d11-triangle.
      # ============================================================

      - name: Build Madeira Wine tools
        shell: bash
        env:
          PATH: "${{ env.LLVM_MINGW_BIN }}:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:/opt/homebrew/bin:/usr/bin:/bin"
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Checking Wine source"
          echo "========================================"

          test -d wine
          test -f wine/configure

          echo "Wine commit:"
          git -C wine rev-parse HEAD

          echo
          echo "========================================"
          echo "Checking PE compilers"
          echo "========================================"

          command -v aarch64-w64-mingw32-clang
          command -v x86_64-w64-mingw32-clang

          echo
          echo "========================================"
          echo "Creating Wine build directory"
          echo "========================================"

          rm -rf wine/build-macos
          mkdir -p wine/build-macos

          cd wine/build-macos

          echo
          echo "========================================"
          echo "Configuring Wine"
          echo "========================================"

          ../configure \
            --with-mingw="${LLVM_MINGW_BIN}/clang" \
            --enable-archs=arm64ec,aarch64,x86_64 \
            --enable-win64 \
            --enable-tools \
            --disable-tests \
            --disable-win16 \
            --without-x \
            --without-wayland \
            --without-xinerama \
            --without-xcursor \
            --without-xinput \
            --without-oss \
            --without-pulse \
            --without-gstreamer \
            --without-v4l2 \
            --without-sane \
            --without-udev \
            --without-usb \
            --without-pcap \
            --without-pcsclite \
            --without-cups \
            --without-dbus \
            --without-gphoto \
            --without-krb5 \
            --without-capi \
            --without-opengl

          echo
          echo "========================================"
          echo "Building Wine tools"
          echo "========================================"

          make \
            -C tools/winebuild \
            -j"$(sysctl -n hw.ncpu)"

          cd "$GITHUB_WORKSPACE"

          WINEBUILD="$GITHUB_WORKSPACE/wine/build-macos/tools/winebuild/winebuild"

          test -x "$WINEBUILD"

          echo
          echo "Winebuild successfully created:"
          ls -lh "$WINEBUILD"

      # ============================================================
      # BUILD FEX
      #
      # IMPORTANT:
      # THERE IS NO build/fex/build.sh.
      #
      # FEX is a git submodule and is built directly with CMake.
      #
      # Outputs:
      #
      # FEX/build-ios/FEXCore/Source/libFEXCore.a
      # FEX/build-ios/FEXCore/Source/libFEXCore_Base.a
      # FEX/build-ios/FEXCore/Source/libJemallocLibs.a
      # ============================================================

      - name: Build FEX for iOS
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "FEX submodule"
          echo "========================================"

          test -d FEX
          test -f FEX/CMakeLists.txt

          echo "FEX commit:"
          git -C FEX rev-parse HEAD

          echo
          echo "========================================"
          echo "Configuring FEX for iOS ARM64"
          echo "========================================"

          rm -rf FEX/build-ios

          cmake \
            -S FEX \
            -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTING=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_ZYDIS=OFF \
            -DENABLE_FEXCORE_PROFILER=OFF \
            -DENABLE_ASSERTIONS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF

          echo
          echo "========================================"
          echo "Building FEXCore"
          echo "========================================"

          cmake \
            --build FEX/build-ios \
            --target FEXCore FEXCore_Base JemallocLibs \
            -j"$(sysctl -n hw.ncpu)"

          echo
          echo "========================================"
          echo "Checking FEX libraries"
          echo "========================================"

          find FEX/build-ios \
            -type f \
            -name "*.a" \
            -print | sort

          test -f FEX/build-ios/FEXCore/Source/libFEXCore.a
          test -f FEX/build-ios/FEXCore/Source/libFEXCore_Base.a
          test -f FEX/build-ios/FEXCore/Source/libJemallocLibs.a

          echo
          echo "FEXCore:"
          ls -lh FEX/build-ios/FEXCore/Source/libFEXCore.a

          echo
          echo "FEXCore_Base:"
          ls -lh FEX/build-ios/FEXCore/Source/libFEXCore_Base.a

          echo
          echo "JemallocLibs:"
          ls -lh FEX/build-ios/FEXCore/Source/libJemallocLibs.a

      # ============================================================
      # BUILD NATIVE MADEIRA COMPONENTS
      #
      # Do NOT call build/fex/build.sh.
      # It does not exist.
      # ============================================================

      - name: Build native dependencies
        shell: bash
        env:
          PATH: "${{ env.LLVM_MINGW_BIN }}:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:/opt/homebrew/bin:/usr/bin:/bin"
          WINEDLOVERRIDES: "mscoree,mshtml="
          WINEDEBUG: "-all"
          WINE: "/opt/homebrew/bin/wine"
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Available Madeira build scripts"
          echo "========================================"

          find build \
            -maxdepth 2 \
            -name build.sh \
            -print | sort

          echo
          echo "========================================"
          echo "Verifying FEX"
          echo "========================================"

          test -f FEX/build-ios/FEXCore/Source/libFEXCore.a
          test -f FEX/build-ios/FEXCore/Source/libFEXCore_Base.a
          test -f FEX/build-ios/FEXCore/Source/libJemallocLibs.a

          echo
          echo "========================================"
          echo "Verifying Wine"
          echo "========================================"

          test -x wine/build-macos/tools/winebuild/winebuild

          echo
          echo "========================================"
          echo "Building crypto-unix"
          echo "========================================"

          if [ -f build/crypto-unix/build.sh ]; then
            bash -x build/crypto-unix/build.sh
          fi

          echo
          echo "========================================"
          echo "Building freetype-ios"
          echo "========================================"

          if [ -f build/freetype-ios/build.sh ]; then
            bash -x build/freetype-ios/build.sh
          fi

          echo
          echo "========================================"
          echo "Building gnutls-ios"
          echo "========================================"

          if [ -f build/gnutls-ios/build.sh ]; then
            bash -x build/gnutls-ios/build.sh
          fi

          echo
          echo "========================================"
          echo "Building ntdll-unix"
          echo "========================================"

          if [ -f build/ntdll-unix/build.sh ]; then
            bash -x build/ntdll-unix/build.sh
          fi

          echo
          echo "========================================"
          echo "Building win32u-unix"
          echo "========================================"

          if [ -f build/win32u-unix/build.sh ]; then
            bash -x build/win32u-unix/build.sh
          fi

          echo
          echo "========================================"
          echo "Building wineserver"
          echo "========================================"

          if [ -f build/wineserver/build.sh ]; then
            bash -x build/wineserver/build.sh
          fi

          echo
          echo "========================================"
          echo "Building wineios-drv"
          echo "========================================"

          if [ -f build/wineios-drv/build.sh ]; then
            bash -x build/wineios-drv/build.sh
          fi

          echo
          echo "========================================"
          echo "Building DXMT iOS"
          echo "========================================"

          if [ ! -f build/dxmt-ios/build.sh ]; then
            echo "ERROR: build/dxmt-ios/build.sh not found"
            exit 1
          fi

          bash -x build/dxmt-ios/build.sh

          echo
          echo "========================================"
          echo "Building DXMT PE modules"
          echo "========================================"

          mkdir -p app/Madeira/aarch64-windows

          if [ ! -e research/dxmt/toolchains ]; then
            ln -s ../../toolchains research/dxmt/toolchains
          fi

          cd research/dxmt

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
          PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:/usr/bin:/opt/homebrew/bin:$PATH" \
          meson setup \
            --cross-file build-aarch64-win.txt \
            --native-file build-osx.txt \
            -Dwine_build_path=../../wine/build-macos \
            build-pe

          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)" \
          PATH="$GITHUB_WORKSPACE/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:/usr/bin:/opt/homebrew/bin:$PATH" \
          meson compile -C build-pe

          cp \
            build-pe/src/d3d11/d3d11.dll \
            build-pe/src/dxgi/dxgi.dll \
            build-pe/src/winemetal/winemetal.dll \
            build-pe/src/d3d10/d3d10core.dll \
            "$GITHUB_WORKSPACE/app/Madeira/aarch64-windows/"

          cd "$GITHUB_WORKSPACE"

          echo
          echo "========================================"
          echo "Building d3d11 triangle"
          echo "========================================"

          if [ ! -f build/d3d11-triangle/build.sh ]; then
            echo "ERROR: build/d3d11-triangle/build.sh not found"
            exit 1
          fi

          bash -x build/d3d11-triangle/build.sh

      # ============================================================
      # COMBINE DXMT
      #
      # Current Madeira README explicitly requires:
      #
      # libdxmt_unix.a + LLVM iOS static libraries
      # ============================================================

      - name: Combine DXMT iOS library
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          DXMT_BUILD="$GITHUB_WORKSPACE/build/dxmt-ios"
          LLVM_BUILD="$GITHUB_WORKSPACE/toolchains/llvm-ios-build"

          echo "========================================"
          echo "Checking DXMT objects"
          echo "========================================"

          test -d "$DXMT_BUILD/obj"

          find "$DXMT_BUILD/obj" \
            -type f \
            -name "*.o" \
            -print | head -20

          echo
          echo "========================================"
          echo "Checking LLVM iOS libraries"
          echo "========================================"

          find "$LLVM_BUILD/lib" \
            -maxdepth 1 \
            -type f \
            -name "*.a" \
            -print | sort

          echo
          echo "========================================"
          echo "Combining DXMT"
          echo "========================================"

          xcrun -sdk iphoneos \
            libtool \
            -static \
            -o "$DXMT_BUILD/libdxmt_combined.a" \
            "$DXMT_BUILD"/obj/*.o \
            "$LLVM_BUILD"/lib/*.a

          mkdir -p app/Madeira

          cp \
            "$DXMT_BUILD/libdxmt_combined.a" \
            app/Madeira/libdxmt_combined.a

          echo
          echo "DXMT combined library:"
          ls -lh app/Madeira/libdxmt_combined.a

      # ============================================================
      # CHECK REQUIRED FILES
      # ============================================================

      - name: Check required Madeira files
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Checking required files"
          echo "========================================"

          REQUIRED=(
            "app/libdxmt_unix.a"
            "app/Madeira/libdxmt_combined.a"
            "app/Madeira/libwineserver.a"
            "app/Madeira/libntdll_unix.a"
            "app/Madeira/libwin32u_unix.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore.a"
            "FEX/build-ios/FEXCore/Source/libFEXCore_Base.a"
            "FEX/build-ios/FEXCore/Source/libJemallocLibs.a"
          )

          MISSING=0

          for FILE in "${REQUIRED[@]}"; do
            if [ -e "$FILE" ]; then
              echo "FOUND:   $FILE"
            else
              echo "MISSING: $FILE"
              MISSING=1
            fi
          done

          echo
          echo "========================================"
          echo "Checking PE modules"
          echo "========================================"

          for FILE in \
            app/Madeira/aarch64-windows/d3d11.dll \
            app/Madeira/aarch64-windows/dxgi.dll \
            app/Madeira/aarch64-windows/winemetal.dll \
            app/Madeira/aarch64-windows/d3d10core.dll
          do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "ERROR: Required Madeira build artifacts are missing."
            exit 1
          fi

      # ============================================================
      # MICROSOFT VC++ RUNTIME
      # ============================================================

      - name: Prepare Microsoft VC++ Runtime
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Downloading Microsoft VC++ Redistributable"
          echo "========================================"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o VC_redist.x64.exe \
            https://aka.ms/vs/17/release/vc_redist.x64.exe

          rm -rf \
            /tmp/vcredist_stage1 \
            /tmp/vcredist

          mkdir -p \
            /tmp/vcredist_stage1 \
            /tmp/vcredist \
            app/Madeira/x86_64-vcruntime

          echo
          echo "========================================"
          echo "Extracting VC++ installer"
          echo "========================================"

          7zz x \
            VC_redist.x64.exe \
            -o/tmp/vcredist_stage1 \
            -y

          echo
          echo "========================================"
          echo "Extracting CAB files"
          echo "========================================"

          find /tmp/vcredist_stage1 \
            -type f \
            -iname "*.cab" \
            -exec 7zz x "{}" -o/tmp/vcredist -y \;

          echo
          echo "========================================"
          echo "Copying VC++ DLLs"
          echo "========================================"

          REQUIRED_DLLS=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            vcamp140.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          for DLL in "${REQUIRED_DLLS[@]}"; do

            SOURCE=$(
              find /tmp/vcredist \
                -type f \
                -iname "$DLL" \
                -print \
                -quit
            )

            if [ -n "$SOURCE" ]; then
              echo "FOUND: $DLL"

              cp \
                "$SOURCE" \
                "app/Madeira/x86_64-vcruntime/$DLL"
            else
              echo "MISSING: $DLL"
              exit 1
            fi

          done

      # ============================================================
      # XCODE BUILD
      # ============================================================

      - name: Build Madeira with Xcode
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          echo "========================================"
          echo "Preparing DerivedData"
          echo "========================================"

          rm -rf build/DerivedData
          mkdir -p build/DerivedData

          echo
          echo "========================================"
          echo "Starting Xcode build"
          echo "========================================"

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      # ============================================================
      # PACKAGE IPA
      # ============================================================

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          APP="build/DerivedData/Build/Products/Release-iphoneos/Madeira.app"

          echo "========================================"
          echo "Checking Madeira.app"
          echo "========================================"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Madeira.app not found"

            find build/DerivedData/Build/Products \
              -maxdepth 3 \
              -type d \
              -print || true

            exit 1
          fi

          echo "FOUND:"
          du -sh "$APP"

          echo
          echo "========================================"
          echo "Creating Payload"
          echo "========================================"

          rm -rf build/Payload

          mkdir -p build/Payload

          cp -R \
            "$APP" \
            build/Payload/Madeira.app

          echo
          echo "========================================"
          echo "Creating IPA"
          echo "========================================"

          cd build

          rm -f Madeira.ipa

          zip \
            -r \
            -q \
            Madeira.ipa \
            Payload

          echo
          echo "========================================"
          echo "IPA created"
          echo "========================================"

          ls -lh Madeira.ipa

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: build/Madeira.ipa
          if-no-files-found: error
