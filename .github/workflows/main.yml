name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode
        shell: bash
        run: |
          set -e

          echo "=== Xcode ==="
          xcodebuild -version

          echo
          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path

      - name: Check required Madeira files
        shell: bash
        run: |
          echo "=== App files ==="
          find app -maxdepth 2 -type f | sort

          echo
          echo "=== Required libraries ==="

          for f in \
            app/libdxmt_unix.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libgnutls.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libnettle.a \
            app/Madeira/libgmp.a \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a
          do
            if [ -e "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Prepare Microsoft VC++ Runtime
        shell: bash
        run: |
          set -e

          echo "=== Installing 7-Zip ==="
          brew install sevenzip

          echo
          echo "=== Downloading Microsoft VC++ Redistributable ==="

          curl -L \
            --fail \
            --retry 3 \
            -o VC_redist.x64.exe \
            https://aka.ms/vs/17/release/vc_redist.x64.exe

          echo
          echo "=== Preparing directories ==="

          rm -rf /tmp/vcredist
          mkdir -p /tmp/vcredist
          mkdir -p app/Madeira/x86_64-vcruntime

          echo
          echo "=== Inspecting Microsoft installer ==="

          7zz l VC_redist.x64.exe

          echo
          echo "=== Extracting Microsoft installer ==="

          7zz x VC_redist.x64.exe \
            -o/tmp/vcredist \
            -y

          echo
          echo "=== Extracted files ==="

          find /tmp/vcredist -type f -print | sort

          echo
          echo "=== Required VC++ runtime DLLs ==="

          required=(
            concrt140.dll
            msvcp140.dll
            msvcp140_1.dll
            msvcp140_2.dll
            msvcp140_atomic_wait.dll
            msvcp140_codecvt_ids.dll
            vcamp140.dll
            vccorlib140.dll
            vcomp140.dll
            vcruntime140.dll
            vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          for dll in "${required[@]}"; do
            source_file=$(find /tmp/vcredist \
              -type f \
              -iname "$dll" \
              -print \
              -quit)

            if [ -n "$source_file" ]; then
              echo "FOUND: $dll"
              cp "$source_file" \
                "app/Madeira/x86_64-vcruntime/$dll"
            else
              echo "MISSING: $dll"
              exit 1
            fi
          done

          echo
          echo "=== Final VC++ runtime directory ==="

          ls -lah app/Madeira/x86_64-vcruntime

          echo
          echo "=== Final verification ==="

          for dll in "${required[@]}"; do
            if [ -f "app/Madeira/x86_64-vcruntime/$dll" ]; then
              echo "OK: $dll"
            else
              echo "ERROR: $dll"
              exit 1
            fi
          done

          echo
          echo "Microsoft VC++ runtime preparation completed successfully."

      - name: Try Xcode build
        shell: bash
        run: |
          set -e

          echo "=== Preparing DerivedData ==="

          mkdir -p build/DerivedData

          echo
          echo "=== Starting Madeira Xcode build ==="

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          set -e

          APP="build/DerivedData/Build/Products/Release-iphoneos/Madeira.app"

          echo "=== Checking Madeira.app ==="

          if [ ! -d "$APP" ]; then
            echo "ERROR: Madeira.app not found!"

            echo
            echo "Available applications:"
            find build/DerivedData -name "*.app" -print

            exit 1
          fi

          echo "Madeira.app found:"
          ls -lah "$APP"

          echo
          echo "=== Creating Payload directory ==="

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP" build/Payload/Madeira.app

          echo
          echo "=== Creating IPA ==="

          cd build

          rm -f Madeira.ipa

          zip -r -q Madeira.ipa Payload

          echo
          echo "=== IPA created successfully ==="

          ls -lh Madeira.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: build/Madeira.ipa
          if-no-files-found: error
