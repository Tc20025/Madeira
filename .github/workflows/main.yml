name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Check required Madeira files
        run: |
          echo "=== App files ==="
          find app -maxdepth 2 -type f | sort

          echo
          echo "=== Required libraries ==="
          for f in \
            app/libdxmt_unix.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libgnutls.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libnettle.a \
            app/Madeira/libgmp.a \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a
          do
            if [ -e "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Try Xcode build
        run: |
          mkdir -p build/DerivedData

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        if: success()
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Madeira.app"

          if [ ! -d "$APP" ]; then
            echo "Madeira.app not found!"
            find build/DerivedData -name "*.app" -print
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Madeira.app

          cd build
          zip -r Madeira.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: build/Madeira.ipa
