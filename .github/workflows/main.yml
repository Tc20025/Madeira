name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode
        shell: bash
        run: |
          set -e
          echo "=== Xcode ==="
          xcodebuild -version
          echo
          echo "=== iPhoneOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install build tools
        shell: bash
        run: |
          set -e
          echo "=== Installing macOS build dependencies ==="
          brew install cmake ninja bison flex pkg-config sevenzip
          
          echo "=== Installing Wine ==="
          brew tap gcenx/wine
          # Removed the invalid --no-quarantine flag and explicitly specified --cask
          brew install --cask gcenx/wine/wine-crossover
          
          echo "=== Linking keg-only tools to PATH ==="
          echo 'export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"' >> $GITHUB_ENV
          echo 'export LDFLAGS="-L/opt/homebrew/opt/bison/lib -L/opt/homebrew/opt/flex/lib"' >> $GITHUB_ENV
          echo 'export CPPFLAGS="-I/opt/homebrew/opt/bison/include -I/opt/homebrew/opt/flex/include"' >> $GITHUB_ENV

      - name: Fetch LLVM MinGW toolchain
        shell: bash
        run: |
          set -e
          echo "=== Downloading LLVM MinGW ==="
          
          mkdir -p toolchains
          cd toolchains
          
          curl -L \
            --fail \
            --retry 3 \
            -O \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz
            
          echo "=== Extracting LLVM MinGW ==="
          tar -xf llvm-mingw-20260421-ucrt-macos-universal.tar.xz
          rm llvm-mingw-20260421-ucrt-macos-universal.tar.xz

      - name: Build native dependencies
        shell: bash
        env:
          WINEDLLOVERRIDES: "mscoree,mshtml="
          WINEDEBUG: "-all"
        run: |
          set -e
          
          echo "=== Initializing Wine Prefix ==="
          wineboot --init || true
          
          echo "=== Compiling native components ==="
          
          for script in build/*/build.sh; do
            if [ -f "$script" ]; then
              echo "--- Executing $script ---"
              bash -x "$script"
            fi
          done

      - name: Check required Madeira files
        shell: bash
        run: |
          echo "=== App files ==="
          find app -maxdepth 2 -type f | sort

          echo
          echo "=== Required libraries ==="
          
          MISSING_FILES=0
          for f in \
            app/libdxmt_unix.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libgnutls.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libnettle.a \
            app/Madeira/libgmp.a \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a
          do
            if [ -e "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              MISSING_FILES=1
            fi
          done
          
          if [ $MISSING_FILES -eq 1 ]; then
            echo "ERROR: Missing required static libraries."
            exit 1
          fi

      - name: Prepare Microsoft VC++ Runtime
        shell: bash
        run: |
          set -e

          echo "=== Downloading Microsoft VC++ Redistributable ==="
          
          curl -L \
            --fail \
            --retry 3 \
            -o VC_redist.x64.exe \
            https://aka.ms/vs/17/release/vc_redist.x64.exe

          echo
          echo "=== Preparing directories ==="
          rm -rf /tmp/vcredist_stage1 /tmp/vcredist
          mkdir -p /tmp/vcredist_stage1
          mkdir -p /tmp/vcredist
          mkdir -p app/Madeira/x86_64-vcruntime

          echo
          echo "=== Extracting Microsoft installer (Stage 1) ==="
          7zz x VC_redist.x64.exe -o/tmp/vcredist_stage1 -y

          echo
          echo "=== Extracting internal CAB files (Stage 2) ==="
          find /tmp/vcredist_stage1 -type f -name "*.cab" -exec 7zz x "{}" -o/tmp/vcredist -y \;

          echo
          echo "=== Required VC++ runtime DLLs ==="
          required=(
            concrt140.dll msvcp140.dll msvcp140_1.dll msvcp140_2.dll
            msvcp140_atomic_wait.dll msvcp140_codecvt_ids.dll vcamp140.dll
            vccorlib140.dll vcomp140.dll vcruntime140.dll vcruntime140_1.dll
            vcruntime140_threads.dll
          )

          for dll in "${required[@]}"; do
            source_file=$(find /tmp/vcredist -type f -iname "*$dll*" -print -quit)
            if [ -n "$source_file" ]; then
              cp "$source_file" "app/Madeira/x86_64-vcruntime/$dll"
            else
              echo "MISSING: $dll"
              exit 1
            fi
          done

      - name: Try Xcode build
        shell: bash
        run: |
          set -e
          echo "=== Preparing DerivedData ==="
          mkdir -p build/DerivedData

          echo "=== Starting Madeira Xcode build ==="
          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        if: success()
        shell: bash
        run: |
          set -e
          APP="build/DerivedData/Build/Products/Release-iphoneos/Madeira.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Madeira.app not found!"
            exit 1
          fi

          echo "=== Creating Payload directory ==="
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Madeira.app

          echo "=== Creating IPA ==="
          cd build
          rm -f Madeira.ipa
          zip -r -q Madeira.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: build/Madeira.ipa
          if-no-files-found: error
