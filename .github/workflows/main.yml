name: Build Madeira IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Madeira
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Check required Madeira files
        run: |
          echo "=== App files ==="
          find app -maxdepth 2 -type f | sort

          echo
          echo "=== Required libraries ==="
          for f in \
            app/libdxmt_unix.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libgnutls.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libnettle.a \
            app/Madeira/libgmp.a \
            FEX/build-ios/FEXCore/Source/libFEXCore.a \
            FEX/build-ios/FEXCore/Source/libFEXCore_Base.a \
            FEX/build-ios/FEXCore/Source/libJemallocLibs.a
          do
            if [ -e "$f" ]; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
            fi
          done
      - name: Prepare Microsoft VC++ Runtime
        run: |
                 - name: Prepare Microsoft VC++ Runtime
          run: |
            brew install sevenzip

            curl -L \
              -o VC_redist.x64.exe \
              https://aka.ms/vs/17/release/vc_redist.x64.exe

            rm -rf /tmp/vcredist
            mkdir -p /tmp/vcredist
            mkdir -p app/Madeira/x86_64-vcruntime

            echo "=== Inspecting VC++ Redistributable ==="
            7zz l VC_redist.x64.exe

            echo "=== Extracting embedded contents ==="
            7zz x VC_redist.x64.exe -o/tmp/vcredist

            echo "=== Searching for CAB files ==="
            find /tmp/vcredist -type f -iname "*.cab" -print

            CAB=$(find /tmp/vcredist -type f -iname "*.cab" -print -quit)

            if [ -z "$CAB" ]; then
              echo "ERROR: No CAB file found!"
              echo "Contents of /tmp/vcredist:"
              find /tmp/vcredist -maxdepth 5 -type f -print
              exit 1
            fi

            echo "Found CAB:"
            echo "$CAB"

            echo "=== Extracting VC++ runtime DLLs ==="
            7zz x "$CAB" -oapp/Madeira/x86_64-vcruntime

            echo "=== VC++ runtime files ==="
            ls -la app/Madeira/x86_64-vcruntime

            echo "=== Checking required DLLs ==="

            required=(
              concrt140.dll
              msvcp140.dll
              msvcp140_1.dll
              msvcp140_2.dll
              msvcp140_atomic_wait.dll
              msvcp140_codecvt_ids.dll
              vcamp140.dll
              vccorlib140.dll
              vcomp140.dll
              vcruntime140.dll
              vcruntime140_1.dll
              vcruntime140_threads.dll
            )

            for dll in "${required[@]}"; do
              if [ -f "app/Madeira/x86_64-vcruntime/$dll" ]; then
                echo "FOUND: $dll"
              else
                echo "MISSING: $dll"
                exit 1
              fi
            done
      - name: Try Xcode build
        run: |
          mkdir -p build/DerivedData

          xcodebuild \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        if: success()
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Madeira.app"

          if [ ! -d "$APP" ]; then
            echo "Madeira.app not found!"
            find build/DerivedData -name "*.app" -print
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Madeira.app

          cd build
          zip -r Madeira.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-IPA
          path: build/Madeira.ipa
